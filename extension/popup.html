<!doctype html>
<meta charset="utf-8">
<title>Jamie</title>
<style>
  /* Chrome's own neutral palette, light or dark to match the browser. Extensions can't read the
     theme's accent color, so nothing here is tinted: it sits right next to any accent. */
  :root {
    color-scheme: light dark;
    --bg: light-dark(#ffffff, #202124); --surface: light-dark(#f1f3f4, #292a2d); --field: light-dark(#ffffff, #202124);
    --line: light-dark(#dadce0, #3c4043); --hover: light-dark(#e8eaed, #35363a);
    --text: light-dark(#202124, #e8eaed); --muted: light-dark(#5f6368, #9aa0a6);
    --ok: light-dark(#188038, #81c995); --err: light-dark(#d93025, #f28b82);
  }
  * { box-sizing: border-box; }
  /* on body, not :root: Chrome gives extension pages body { font-size: 75% } */
  body { width: 360px; margin: 0; padding: 12px; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 8px; margin: 2px 2px 12px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; }
  .pill { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.on { color: var(--ok); } .pill.off { color: var(--err); }
  .card { background: var(--surface); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  label { display: block; margin: 10px 0 4px; font-size: 12px; color: var(--muted); }
  .card > label:first-of-type, .grid label { margin-top: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 8px; margin-top: 10px; }
  input, select { width: 100%; height: 30px; padding: 0 8px; font: inherit; color: var(--text); background: var(--field);
    border: 1px solid var(--line); border-radius: 6px; }
  input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  select:disabled { color: var(--muted); }
  input::placeholder { color: var(--muted); }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--field); color: var(--text); padding: 5px 12px; }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { cursor: default; opacity: .5; }
  #start { width: 100%; height: 34px; margin: 0 0 8px; border: 0; font-weight: 500; color: var(--bg); background: var(--text); }
  #start:hover:not(:disabled) { background: var(--text); opacity: .88; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
  .row b { display: block; font-weight: 500; }
  .row small { color: var(--muted); font-size: 12px; }
  .switch { margin: 0; }
  .switch input { width: 16px; height: 16px; margin: 0; accent-color: var(--text); cursor: pointer; }
  .switch span { display: none; }
  details.card { padding: 0; }
  summary { cursor: pointer; padding: 10px 12px; font-weight: 500; }
  summary .sub { font-weight: 400; margin-left: 4px; }
  .body { padding: 0 12px 12px; }
  #preview { width: 100%; aspect-ratio: 16 / 9; border-radius: 6px; display: block; margin-bottom: 10px; }
  #status { margin: 0 2px 8px; font-size: 12px; color: var(--muted); }
  #status:empty { display: none; }
  #status.err { color: var(--err); }
  .count { color: var(--muted); font-weight: 400; }
  ul { padding: 0; margin: 0; list-style: none; }
  li { padding: 8px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; padding-top: 0; }
  .top { display: flex; align-items: center; gap: 8px; }
  .name { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 11px; color: var(--muted); }
  .meta, #jamies .heard { color: var(--muted); font-size: 12px; margin: 2px 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
  .links a { color: var(--text); }
  li button { padding: 2px 10px; font-size: 12px; }
  li.empty { color: var(--muted); font-size: 12px; padding: 0; }
  #save { margin-top: 10px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
</style>
<header>
  <h1>Jamie</h1>
  <span class="pill" id="conn">Not connected</span>
</header>
<form id="form">
  <section class="card">
    <label for="meet">Meeting link</label>
    <input id="meet" required placeholder="https://meet.google.com/abc-defg-hij" spellcheck="false">
    <div class="grid">
      <div><label for="env">Environment</label><select id="env" disabled><option>Connect first</option></select></div>
      <div><label for="personality">Personality</label><select id="personality" disabled><option>Connect first</option></select></div>
    </div>
    <label for="agent">Agent</label>
    <select id="agent" disabled><option>Connect first</option></select>
    <div class="row">
      <div><b id="voice-label">Voice</b><small id="voice-hint">Jamie talks in the call</small></div>
      <label class="switch"><input id="voice" type="checkbox" role="switch" checked aria-labelledby="voice-label" aria-describedby="voice-hint"><span></span></label>
    </div>
  </section>
  <details class="card" id="lookbox">
    <summary>Look <span class="sub">design the avatar</span></summary>
    <div class="body">
      <canvas id="preview" width="640" height="360" aria-label="Preview of Jamie's avatar"></canvas>
      <div class="grid" id="looks"></div>
    </div>
  </details>
  <button id="start" disabled>Send Jamie</button>
</form>
<div id="status" role="status"></div>
<section class="card">
  <h2>Running <span class="count" id="count">0</span></h2>
  <ul id="jamies"><li class="empty">Connect to see running Jamies.</li></ul>
</section>
<details class="card" id="settings">
  <summary>Settings</summary>
  <div class="body">
    <label for="url">Controller URL</label>
    <input id="url" spellcheck="false">
    <label for="token">Token <span class="sub">(<code>JAMIE_CONTROLLER_TOKEN</code> in .env)</span></label>
    <input id="token" type="password">
    <button id="save" type="button">Save</button>
  </div>
</details>
<script src="avatar.js"></script>
<script type="module" src="popup.js"></script>
